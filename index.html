ie è vietato il taglio raso; provvigioni minime 150 m³/ha (pini e querceti mediterranei), 250 m³/ha (cerro, latifoglie, pino nero e laricio), 350 m³/ha (faggio). Art. 39 – diradamenti: fino a 30 anni max 15% dell'area basimetrica, fino a 60 anni max 20%. Art. 40 – tutti i tagli nelle fustaie sono autorizzati."],prelievoG:[[30,15],[60,20]],adsCeduo:400,adsFustaia:400,adsMax:1256.6,adsTesto:"Allegato C (elaborati progettuali) – Aree di saggio da 400 m² (popolamenti coetaneiformi) fino a 1256,6 m² (raggio 20 m, popolamenti con struttura composita), aumentabili per soprassuoli radi o degradati; in numero congruo e rappresentativo; centro georeferenziato (UTM 33N WGS84) e contrassegnato con vernice (AS1, AS2…). Per ogni area: piedilista di cavallettamento, distribuzione diametrica, N/ha, G/ha, curva ipsometrica, età media, provvigione/ha e totale."},Basilicata:{fonte:"Regolamento per il taglio dei boschi in assenza di Piani di assestamento (D.G.R. 20 aprile 2004, n. 956; L.R. 10 novembre 1998, n. 42) – inserire i valori dal testo vigente",verificato:!1,turni:{},matr:"",matrCastagno:"",matr2T:"",composto:"",esenti:[],periodo:"",tagliataMax:"",tagliataMaxPend:"",dMartellata:"",testi:[],prelievoG:[],adsCeduo:500,adsFustaia:2500,adsMax:"",adsTesto:"Aree di saggio: 500 m² nei cedui, 2500 m² nelle fustaie."},Campania:{fonte:"Regolamento regionale 28 settembre 2017, n. 3 e s.m.i. (art. 57 martellata e segni convenzionali; artt. 62-67 cedui) – inserire i valori dal testo vigente",verificato:!1,turni:{},matr:"",matrCastagno:"",matr2T:"",composto:"",esenti:[],periodo:"",tagliataMax:"",tagliataMaxPend:"",dMartellata:"",testi:[],prelievoG:[],adsCeduo:"",adsFustaia:"",adsMax:"",adsTesto:"Superficie delle aree di saggio da inserire dal testo vigente."}},SEZIONI={fustaia:"Alto fusto",ceduo:"Ceduo"},GOVERNI_SEZ={fustaia:["Fustaia","Fustaia transitoria","Ceduo in conversione / avviamento"],ceduo:["Ceduo semplice","Ceduo matricinato","Ceduo composto"]},INTERVENTI_SEZ={fustaia:["Diradament
